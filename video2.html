<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Processor & Storage</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        .video-card {
            transition: all 0.3s ease;
        }
        
        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        .upload-zone {
            border: 2px dashed #e5e7eb;
            transition: all 0.3s ease;
        }
        
        .upload-zone.dragover {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        
        .progress-bar {
            transition: width 0.3s ease;
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50 min-h-screen">
    <div class="container mx-auto px-6 py-8">
        <!-- Header -->
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold text-gray-800 mb-4">🎬 Video Processor</h1>
            <p class="text-gray-600 text-lg">Upload, organize, and manage your video collection</p>
        </div>

        <!-- Upload Section -->
        <div class="bg-white rounded-2xl shadow-lg p-8 mb-8">
            <h2 class="text-2xl font-semibold text-gray-800 mb-6">📤 Upload Videos</h2>
            
            <div id="uploadZone" class="upload-zone rounded-xl p-12 text-center cursor-pointer">
                <div class="mb-4">
                    <svg class="mx-auto h-16 w-16 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                    </svg>
                </div>
                <h3 class="text-xl font-medium text-gray-700 mb-2">Drop videos here or click to browse</h3>
                <p class="text-gray-500">Supports MP4, AVI, MOV, WMV files up to 500MB</p>
                <input type="file" id="fileInput" class="hidden" accept="video/*" multiple>
            </div>

            <!-- Upload Progress -->
            <div id="uploadProgress" class="hidden mt-6">
                <div class="bg-gray-200 rounded-full h-3">
                    <div id="progressBar" class="progress-bar bg-blue-500 h-3 rounded-full" style="width: 0%"></div>
                </div>
                <p id="progressText" class="text-sm text-gray-600 mt-2">Uploading...</p>
            </div>
        </div>

        <!-- Filter and Search -->
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
            <div class="flex flex-wrap gap-4 items-center">
                <div class="flex-1 min-w-64">
                    <input type="text" id="searchInput" placeholder="🔍 Search videos..." 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <select id="categoryFilter" class="px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    <option value="">All Categories</option>
                    <option value="entertainment">Entertainment</option>
                    <option value="education">Education</option>
                    <option value="work">Work</option>
                    <option value="personal">Personal</option>
                </select>
                <select id="sortBy" class="px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="name">Name A-Z</option>
                    <option value="size">File Size</option>
                </select>
            </div>
        </div>

        <!-- Video Library -->
        <div class="bg-white rounded-2xl shadow-lg p-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-semibold text-gray-800">📚 Video Library</h2>
                <span id="videoCount" class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-medium">0 videos</span>
            </div>

            <div id="videoGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Videos will be displayed here -->
            </div>

            <div id="emptyState" class="text-center py-16">
                <div class="text-6xl mb-4">🎥</div>
                <h3 class="text-xl font-medium text-gray-700 mb-2">No videos yet</h3>
                <p class="text-gray-500">Upload your first video to get started!</p>
            </div>
        </div>
    </div>

    <!-- Video Details Modal -->
    <div id="videoModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full max-h-90vh overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-start mb-4">
                    <h3 id="modalTitle" class="text-xl font-semibold text-gray-800"></h3>
                    <button id="closeModal" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
                </div>
                
                <div id="modalContent" class="space-y-4">
                    <!-- Modal content will be populated here -->
                </div>
                
                <div class="flex gap-3 mt-6">
                    <input type="text" id="editTitle" placeholder="Video title" 
                           class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    <select id="editCategory" class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="entertainment">Entertainment</option>
                        <option value="education">Education</option>
                        <option value="work">Work</option>
                        <option value="personal">Personal</option>
                    </select>
                </div>
                
                <div class="flex gap-3 mt-4">
                    <button id="saveChanges" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg font-medium">
                        Save Changes
                    </button>
                    <button id="deleteVideo" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-medium">
                        Delete Video
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        class VideoProcessor {
            constructor() {
                this.videos = JSON.parse(localStorage.getItem('videoLibrary')) || [];
                this.currentVideoId = null;
                this.initializeEventListeners();
                this.renderVideos();
            }

            initializeEventListeners() {
                const uploadZone = document.getElementById('uploadZone');
                const fileInput = document.getElementById('fileInput');
                
                // Upload zone interactions
                uploadZone.addEventListener('click', () => fileInput.click());
                uploadZone.addEventListener('dragover', this.handleDragOver.bind(this));
                uploadZone.addEventListener('dragleave', this.handleDragLeave.bind(this));
                uploadZone.addEventListener('drop', this.handleDrop.bind(this));
                
                fileInput.addEventListener('change', this.handleFileSelect.bind(this));
                
                // Search and filter
                document.getElementById('searchInput').addEventListener('input', this.filterVideos.bind(this));
                document.getElementById('categoryFilter').addEventListener('change', this.filterVideos.bind(this));
                document.getElementById('sortBy').addEventListener('change', this.filterVideos.bind(this));
                
                // Modal interactions
                document.getElementById('closeModal').addEventListener('click', this.closeModal.bind(this));
                document.getElementById('saveChanges').addEventListener('click', this.saveVideoChanges.bind(this));
                document.getElementById('deleteVideo').addEventListener('click', this.deleteVideo.bind(this));
                
                // Close modal on outside click
                document.getElementById('videoModal').addEventListener('click', (e) => {
                    if (e.target.id === 'videoModal') this.closeModal();
                });
            }

            handleDragOver(e) {
                e.preventDefault();
                e.currentTarget.classList.add('dragover');
            }

            handleDragLeave(e) {
                e.currentTarget.classList.remove('dragover');
            }

            handleDrop(e) {
                e.preventDefault();
                e.currentTarget.classList.remove('dragover');
                const files = Array.from(e.dataTransfer.files).filter(file => file.type.startsWith('video/'));
                this.processFiles(files);
            }

            handleFileSelect(e) {
                const files = Array.from(e.target.files);
                this.processFiles(files);
            }

            processFiles(files) {
                if (files.length === 0) return;
                
                const progressContainer = document.getElementById('uploadProgress');
                const progressBar = document.getElementById('progressBar');
                const progressText = document.getElementById('progressText');
                
                progressContainer.classList.remove('hidden');
                
                files.forEach((file, index) => {
                    // Simulate upload progress
                    let progress = 0;
                    const interval = setInterval(() => {
                        progress += Math.random() * 15;
                        if (progress >= 100) {
                            progress = 100;
                            clearInterval(interval);
                            this.addVideo(file);
                            
                            if (index === files.length - 1) {
                                setTimeout(() => {
                                    progressContainer.classList.add('hidden');
                                    progressBar.style.width = '0%';
                                }, 1000);
                            }
                        }
                        
                        progressBar.style.width = progress + '%';
                        progressText.textContent = `Uploading ${file.name}... ${Math.round(progress)}%`;
                    }, 100);
                });
            }

            addVideo(file) {
                // Create a blob URL for the video
                const videoUrl = URL.createObjectURL(file);
                
                const video = {
                    id: Date.now() + Math.random(),
                    name: file.name.replace(/\.[^/.]+$/, ""),
                    originalName: file.name,
                    size: file.size,
                    type: file.type,
                    uploadDate: new Date().toISOString(),
                    category: 'entertainment',
                    duration: '00:00',
                    thumbnail: this.generateThumbnail(),
                    videoUrl: videoUrl,
                    file: file // Keep reference to original file
                };
                
                // Get video duration
                this.getVideoDuration(videoUrl, video);
                
                this.videos.unshift(video);
                this.renderVideos();
                
                // Show success notification
                this.showNotification(`✅ ${video.name} uploaded successfully!`);
            }

            generateThumbnail() {
                const colors = ['bg-blue-400', 'bg-green-400', 'bg-purple-400', 'bg-pink-400', 'bg-yellow-400'];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            getVideoDuration(videoUrl, videoObj) {
                const videoElement = document.createElement('video');
                videoElement.preload = 'metadata';
                
                videoElement.onloadedmetadata = () => {
                    const duration = videoElement.duration;
                    if (!isNaN(duration) && duration > 0) {
                        const minutes = Math.floor(duration / 60);
                        const seconds = Math.floor(duration % 60);
                        videoObj.duration = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                        this.renderVideos();
                    }
                };
                
                videoElement.src = videoUrl;
            }

            formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            formatDate(dateString) {
                return new Date(dateString).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
            }

            renderVideos() {
                const grid = document.getElementById('videoGrid');
                const emptyState = document.getElementById('emptyState');
                const videoCount = document.getElementById('videoCount');
                
                if (this.videos.length === 0) {
                    grid.innerHTML = '';
                    emptyState.classList.remove('hidden');
                    videoCount.textContent = '0 videos';
                    return;
                }
                
                emptyState.classList.add('hidden');
                videoCount.textContent = `${this.videos.length} video${this.videos.length !== 1 ? 's' : ''}`;
                
                grid.innerHTML = this.videos.map(video => `
                    <div class="video-card bg-gray-50 rounded-xl p-4 cursor-pointer fade-in" onclick="videoProcessor.openVideoModal('${video.id}')">
                        <div class="aspect-video ${video.thumbnail} rounded-lg mb-4 flex items-center justify-center relative group">
                            <svg class="w-12 h-12 text-white group-hover:scale-110 transition-transform" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"/>
                            </svg>
                            <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-20 rounded-lg transition-all flex items-center justify-center">
                                <span class="text-white text-sm opacity-0 group-hover:opacity-100 transition-opacity">▶️ Click to Play</span>
                            </div>
                        </div>
                        <h3 class="font-medium text-gray-800 mb-2 truncate">${video.name}</h3>
                        <div class="text-sm text-gray-500 space-y-1">
                            <div class="flex justify-between">
                                <span>📁 ${video.category}</span>
                                <span>📏 ${this.formatFileSize(video.size)}</span>
                            </div>
                            <div class="flex justify-between">
                                <span>📅 ${this.formatDate(video.uploadDate)}</span>
                                <span>⏱️ ${video.duration}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            openVideoModal(videoId) {
                const video = this.videos.find(v => v.id == videoId);
                if (!video) return;
                
                this.currentVideoId = videoId;
                const modal = document.getElementById('videoModal');
                const modalTitle = document.getElementById('modalTitle');
                const modalContent = document.getElementById('modalContent');
                const editTitle = document.getElementById('editTitle');
                const editCategory = document.getElementById('editCategory');
                
                modalTitle.textContent = video.name;
                editTitle.value = video.name;
                editCategory.value = video.category;
                
                // Create fresh blob URL for the video
                let videoHTML = '';
                if (video.file) {
                    const videoUrl = URL.createObjectURL(video.file);
                    videoHTML = `
                        <video controls class="w-full h-full object-contain bg-black" preload="metadata" 
                               src="${videoUrl}" type="${video.type}">
                            Your browser does not support the video tag.
                        </video>`;
                } else {
                    videoHTML = `
                        <div class="${video.thumbnail} rounded-lg flex items-center justify-center h-full">
                            <div class="text-center">
                                <svg class="w-16 h-16 text-white mx-auto mb-2" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"/>
                                </svg>
                                <p class="text-white text-sm">Video file not available</p>
                            </div>
                        </div>`;
                }
                
                modalContent.innerHTML = `
                    <div class="aspect-video bg-black rounded-lg mb-4 overflow-hidden">
                        ${videoHTML}
                    </div>
                    <div class="grid grid-cols-2 gap-4 text-sm">
                        <div><strong>File Name:</strong> ${video.originalName}</div>
                        <div><strong>File Size:</strong> ${this.formatFileSize(video.size)}</div>
                        <div><strong>Upload Date:</strong> ${this.formatDate(video.uploadDate)}</div>
                        <div><strong>Duration:</strong> ${video.duration}</div>
                        <div><strong>Format:</strong> ${video.type}</div>
                        <div><strong>Category:</strong> ${video.category}</div>
                    </div>
                `;
                
                modal.classList.remove('hidden');
            }

            closeModal() {
                document.getElementById('videoModal').classList.add('hidden');
                this.currentVideoId = null;
            }

            saveVideoChanges() {
                if (!this.currentVideoId) return;
                
                const video = this.videos.find(v => v.id == this.currentVideoId);
                const newTitle = document.getElementById('editTitle').value.trim();
                const newCategory = document.getElementById('editCategory').value;
                
                if (newTitle) {
                    video.name = newTitle;
                    video.category = newCategory;
                    this.saveToStorage();
                    this.renderVideos();
                    this.closeModal();
                    this.showNotification('✅ Video updated successfully!');
                }
            }

            deleteVideo() {
                if (!this.currentVideoId) return;
                
                if (confirm('Are you sure you want to delete this video?')) {
                    this.videos = this.videos.filter(v => v.id != this.currentVideoId);
                    this.saveToStorage();
                    this.renderVideos();
                    this.closeModal();
                    this.showNotification('🗑️ Video deleted successfully!');
                }
            }

            filterVideos() {
                const searchTerm = document.getElementById('searchInput').value.toLowerCase();
                const categoryFilter = document.getElementById('categoryFilter').value;
                const sortBy = document.getElementById('sortBy').value;
                
                let filteredVideos = [...this.videos];
                
                // Apply search filter
                if (searchTerm) {
                    filteredVideos = filteredVideos.filter(video => 
                        video.name.toLowerCase().includes(searchTerm) ||
                        video.originalName.toLowerCase().includes(searchTerm)
                    );
                }
                
                // Apply category filter
                if (categoryFilter) {
                    filteredVideos = filteredVideos.filter(video => video.category === categoryFilter);
                }
                
                // Apply sorting
                filteredVideos.sort((a, b) => {
                    switch (sortBy) {
                        case 'oldest':
                            return new Date(a.uploadDate) - new Date(b.uploadDate);
                        case 'name':
                            return a.name.localeCompare(b.name);
                        case 'size':
                            return b.size - a.size;
                        default: // newest
                            return new Date(b.uploadDate) - new Date(a.uploadDate);
                    }
                });
                
                // Temporarily replace videos array for rendering
                const originalVideos = this.videos;
                this.videos = filteredVideos;
                this.renderVideos();
                this.videos = originalVideos;
            }

            saveToStorage() {
                // Don't save video URLs or file objects to localStorage
                // They won't work after page refresh anyway
                const videosForStorage = this.videos.map(video => ({
                    id: video.id,
                    name: video.name,
                    originalName: video.originalName,
                    size: video.size,
                    type: video.type,
                    uploadDate: video.uploadDate,
                    category: video.category,
                    duration: video.duration,
                    thumbnail: video.thumbnail
                }));
                localStorage.setItem('videoLibrary', JSON.stringify(videosForStorage));
            }

            showNotification(message) {
                const notification = document.createElement('div');
                notification.className = 'fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg z-50 fade-in';
                notification.textContent = message;
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.remove();
                }, 3000);
            }
        }

        // Initialize the video processor
        const videoProcessor = new VideoProcessor();
    </script>
