<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permanent File Saver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .file-item {
            transition: all 0.3s ease;
        }
        .file-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .upload-zone {
            transition: all 0.3s ease;
        }
        .upload-zone.dragover {
            background-color: #dbeafe;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- Header with Back Button -->
        <div class="flex items-center justify-between mb-8">
            <button onclick="goBack()" class="flex items-center space-x-2 bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                <span>Back</span>
            </button>
            <h1 class="text-3xl font-bold text-gray-800">Permanent File Saver</h1>
            <div class="w-20"></div> <!-- Spacer for centering -->
        </div>

        <!-- Upload Zone -->
        <div class="bg-white rounded-xl shadow-lg p-8 mb-8">
            <div id="uploadZone" class="upload-zone border-3 border-dashed border-gray-300 rounded-lg p-12 text-center cursor-pointer">
                <svg class="mx-auto h-16 w-16 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                </svg>
                <h3 class="text-xl font-semibold text-gray-700 mb-2">Drop files here or click to upload</h3>
                <p class="text-gray-500">Files will be stored permanently in your browser until you delete them</p>
                <input type="file" id="fileInput" multiple class="hidden">
            </div>
        </div>

        <!-- Storage Info -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
            <div class="flex items-center justify-between">
                <div>
                    <h3 class="text-lg font-semibold text-gray-800">Storage Information</h3>
                    <p class="text-gray-600">Total files stored: <span id="fileCount" class="font-bold text-blue-600">0</span></p>
                </div>
                <button onclick="clearAllFiles()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg transition-colors">
                    Clear All Files
                </button>
            </div>
        </div>

        <!-- Files List -->
        <div class="bg-white rounded-xl shadow-lg p-6">
            <h3 class="text-xl font-semibold text-gray-800 mb-6">Stored Files</h3>
            <div id="filesList" class="space-y-4">
                <p class="text-gray-500 text-center py-8">No files stored yet. Upload some files to get started!</p>
            </div>
        </div>
    </div>

    <script>
        // Initialize the file saver
        let storedFiles = JSON.parse(localStorage.getItem('permanentFiles') || '[]');
        
        // DOM elements
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const filesList = document.getElementById('filesList');
        const fileCount = document.getElementById('fileCount');

        // Back button functionality
        function goBack() {
            window.location.href = 'main.html';
        }

        // Upload zone click handler
        uploadZone.addEventListener('click', () => {
            fileInput.click();
        });

        // Drag and drop handlers
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        // File input change handler
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        // Handle file uploads
        function handleFiles(files) {
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const fileData = {
                        id: Date.now() + Math.random(),
                        name: file.name,
                        size: file.size,
                        type: file.type,
                        data: e.target.result,
                        uploadDate: new Date().toISOString()
                    };
                    
                    storedFiles.push(fileData);
                    saveFiles();
                    renderFiles();
                };
                reader.readAsDataURL(file);
            });
        }

        // Save files to localStorage
        function saveFiles() {
            localStorage.setItem('permanentFiles', JSON.stringify(storedFiles));
        }

        // Format file size
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Get file icon based on type
        function getFileIcon(type) {
            if (type.startsWith('image/')) return '🖼️';
            if (type.startsWith('video/')) return '🎥';
            if (type.startsWith('audio/')) return '🎵';
            if (type.includes('pdf')) return '📄';
            if (type.includes('text')) return '📝';
            if (type.includes('zip') || type.includes('rar')) return '📦';
            return '📁';
        }

        // Download file
        window.downloadFile = function(fileId) {
            const file = storedFiles.find(f => f.id === fileId);
            if (file) {
                const link = document.createElement('a');
                link.href = file.data;
                link.download = file.name;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        // Delete file
        window.deleteFile = function(fileId) {
            if (confirm('Are you sure you want to delete this file?')) {
                storedFiles = storedFiles.filter(f => f.id !== fileId);
                saveFiles();
                renderFiles();
            }
        }

        // Clear all files
        window.clearAllFiles = function() {
            if (confirm('Are you sure you want to delete ALL stored files? This cannot be undone.')) {
                storedFiles = [];
                saveFiles();
                renderFiles();
            }
        }

        // View/Play file
        window.viewFile = function(fileId) {
            const file = storedFiles.find(f => f.id === fileId);
            if (file) {
                openFileViewer(file);
            }
        }

        // Open file viewer modal
        function openFileViewer(file) {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center z-50';
            
            let content = '';
            
            if (file.type.startsWith('image/')) {
                content = `<img src="${file.data}" alt="${file.name}" class="w-full h-full object-contain">`;
            } else if (file.type.startsWith('video/')) {
                content = `<video controls class="w-full h-full" style="max-height: 100vh;">
                    <source src="${file.data}" type="${file.type}">
                    Your browser does not support the video tag.
                </video>`;
            } else if (file.type.startsWith('audio/')) {
                content = `<div class="bg-white rounded-lg p-12 text-center w-full max-w-2xl mx-4">
                    <div class="text-8xl mb-6">🎵</div>
                    <h3 class="text-2xl font-semibold mb-6">${file.name}</h3>
                    <audio controls class="w-full h-12">
                        <source src="${file.data}" type="${file.type}">
                        Your browser does not support the audio tag.
                    </audio>
                </div>`;
            } else if (file.type === 'application/pdf') {
                content = `<iframe src="${file.data}" class="w-full h-full bg-white" style="min-height: 100vh;"></iframe>`;
            } else if (file.type.startsWith('text/')) {
                // For text files, we need to decode the base64 data
                const textContent = atob(file.data.split(',')[1]);
                content = `<div class="bg-white rounded-lg p-8 w-full h-full mx-4 my-4 overflow-auto">
                    <h3 class="text-2xl font-semibold mb-6">${file.name}</h3>
                    <pre class="whitespace-pre-wrap text-base leading-relaxed">${textContent}</pre>
                </div>`;
            } else {
                content = `<div class="bg-white rounded-lg p-12 text-center w-full max-w-2xl mx-4">
                    <div class="text-8xl mb-6">${getFileIcon(file.type)}</div>
                    <h3 class="text-2xl font-semibold mb-4">${file.name}</h3>
                    <p class="text-gray-600 mb-6 text-lg">This file type cannot be previewed</p>
                    <button onclick="downloadFile(${file.id}); closeModal()" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg text-lg">
                        Download File
                    </button>
                </div>`;
            }
            
            modal.innerHTML = `
                <div class="relative w-full h-full flex items-center justify-center">
                    <button onclick="closeModal()" class="absolute top-4 right-4 bg-red-500 hover:bg-red-600 text-white rounded-full w-12 h-12 flex items-center justify-center z-20 text-xl font-bold">
                        ✕
                    </button>
                    ${content}
                </div>
            `;
            
            document.body.appendChild(modal);
            window.currentModal = modal;
        }

        // Close modal
        window.closeModal = function() {
            if (window.currentModal) {
                document.body.removeChild(window.currentModal);
                window.currentModal = null;
            }
        }

        // Close modal when clicking outside
        document.addEventListener('click', (e) => {
            if (window.currentModal && e.target === window.currentModal) {
                closeModal();
            }
        });

        // Render files list
        function renderFiles() {
            fileCount.textContent = storedFiles.length;
            
            if (storedFiles.length === 0) {
                filesList.innerHTML = '<p class="text-gray-500 text-center py-8">No files stored yet. Upload some files to get started!</p>';
                return;
            }

            filesList.innerHTML = storedFiles.map(file => `
                <div class="file-item bg-gray-50 rounded-lg p-4 flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                        <div class="text-3xl">${getFileIcon(file.type)}</div>
                        <div>
                            <h4 class="font-semibold text-gray-800">${file.name}</h4>
                            <p class="text-sm text-gray-600">
                                ${formatFileSize(file.size)} • 
                                Uploaded ${new Date(file.uploadDate).toLocaleDateString()}
                            </p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="viewFile(${file.id})" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded text-sm transition-colors">
                            View
                        </button>
                        <button onclick="downloadFile(${file.id})" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded text-sm transition-colors">
                            Download
                        </button>
                        <button onclick="deleteFile(${file.id})" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm transition-colors">
                            Delete
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Initialize the app
        renderFiles();
    </script>

</html>
