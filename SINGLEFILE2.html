<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTIMATE MAINFRAME</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black min-h-screen p-0 font-mono">
    <div class="min-h-screen">
        <div class="bg-black text-green-400 min-h-screen p-8">

            
            <h1 class="text-4xl font-bold text-green-400 mb-2 text-center tracking-wider">SINGLEFILE ULTIMATE MAINFRAME
            </h1>
            <div class="text-center mb-6">
                <span class="text-green-300 text-sm">JUN 10 2026</span>
            </div>
            
            <!-- Legend -->
            <div class="flex justify-center gap-8 mb-8 border border-green-400 p-4 bg-gray-900">
                <div class="flex items-center">
                    <div class="w-3 h-3 bg-green-400 mr-2 animate-pulse"></div>
                    <span class="text-sm font-medium text-green-400">TOOLS</span>
                </div>
                <div class="flex items-center">
                    <div class="w-3 h-3 bg-red-400 mr-2 animate-pulse"></div>
                    <span class="text-sm font-medium text-red-400">GAMES</span>
                </div>
            </div>
            
            <!-- Search Bar -->
            <div class="relative mb-6">
                <input 
                    type="text" 
                    id="searchInput"
                    placeholder="ENTER SEARCH QUERY..."
                    class="w-full px-4 py-3 pl-12 text-lg bg-black border-2 border-green-400 text-green-400 placeholder-green-600 focus:border-green-300 focus:outline-none transition-colors font-mono"
                >
                <svg class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>

            <!-- Results List -->
            <div id="resultsList" class="space-y-2">
                <!-- Results will be populated here -->
            </div>

            <!-- No Results Message -->
            <div id="noResults" class="text-center text-red-400 py-8 hidden border border-red-400 bg-gray-900">
                <svg class="w-16 h-16 mx-auto mb-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
                <p class="text-lg font-mono">NO FILES FOUND</p>
                <p class="text-sm font-mono">MODIFY SEARCH PARAMETERS</p>
            </div>
            <!-- Version Footer -->
            <div class="text-center mt-8 pt-4 border-t border-green-400">
                <span class="text-green-300 text-sm font-mono">MAINFRAME v2.5.3</span>
            </div>
        </div>
    </div>

    <script>
        // HTML files with display names, file paths, and categories
        // Category: 'tool' or 'game'
        const htmlFiles = {
            // 'DISPLAY NAME': { file: 'htmlfile.html', category: 'game' },
            'MAINFRAME NORMAL': { file: 'main.html', category: 'tool' },
            '3D PUZZLES': { file: '3d-puzzle.html', category: 'game' },
            'BASE 64 CONVERTER': { file: 'Base64.html', category: 'tool' },
            '3D TANK SIMULATOR': { file: '3dtanksim.html', category: 'game' },
            '10 WAR GAMES': { file: '10wargames.html', category: 'game' },
            '2048': { file: '2048.html', category: 'game' },
            'DATA:TEXT/HTML URL GENERATOR': { file: 'dataUrl.html', category: 'tool' },
            'CALCULATOR': { file: 'CALCULATOR.html', category: 'tool' },
            'CONWAY GAME OF LIFE': { file: 'conway0.html', category: 'game' },
            'COSMIC DEFENDER': { file: 'cosmic-defend.html', category: 'game' },
            'DESIGNCRAFT STUDIO': { file: 'designcraft.html', category: 'tool' },
            'INTERACTIVE WHITEBOARD': { file: 'whiteboard.html', category: 'tool' },
            'DIVINE WARS': { file: 'divine-war.html', category: 'game' },
            'EXTRA TOOLS': { file: 'ExtraTools.html', category: 'tool' },
            'FOOD TRUCK TYCOON': { file: 'foodtruckTycoon.html', category: 'game' },
            'GAME HUB': { file: 'gameHub.html', category: 'game' },
            'HOTEL': { file: 'grandhotel2.html', category: 'game' },
            'GRAPHING CALCULATOR (BETA)': { file: 'Graphing-SLOW-Beta.html', category: 'tool' },
            'HACKER SIMULATOR': { file: 'hackerSim.html', category: 'game' },
            'HARRY POTTER TYCOON': { file: 'harrypottertycoon.html', category: 'game' },
            'HTML EDITOR PRO': { file: 'html-editorPRO.html', category: 'tool' },
            'MAGICIAN\'S EMPIRE': { file: 'magician-empire.html', category: 'game' },
            'MAGICIAN TYCOON': { file: 'magiciantycoon.html', category: 'game' },
            'MAIN FILE (ARCHIVE)': { file: 'main-archive.html', category: 'tool' },
            'MONOPOLY': { file: 'monopoly.html', category: 'game' },
            'PACMAN': { file: 'pacman.html', category: 'game' },
            'PANTHEON WARS': { file: 'pantheon2.html', category: 'game' },
            'ROCK PAPER SCISSORS': { file: 'paper-scissor-rock.html', category: 'game' },
            'PET TYCOON': { file: 'pettycoon.html', category: 'game' },
            'PONG GAME': { file: 'pong.html', category: 'game' },
            'QUIZCRAFT': { file: 'quizcraft.html', category: 'tool' },
            'SHOOTER GAME': { file: 'shootergame.html', category: 'game' },
            'SCHOOL SIMULATOR': { file: 'schoolsim.html', category: 'game' },
            'FILE RUNNER': { file: 'filerunner.html', category: 'tool' },
            'FARMER RPG': { file: 'farmer.html', category: 'game' },
            'FILE EXPLORER': { file: 'file-saver.html', category: 'tool' },
            'AIRPORT SIMULATOR': { file: 'aerport.html', category: 'game' },
            'ARCADE SIMULATOR': { file: 'arcade-sim.html', category: 'game' },
            'SKI RESORT SIMULATOR': { file: 'ski.html', category: 'game' },
            'CASINO TYCOON': { file: 'CasinoTycoon.html', category: 'game' },
            'SPA TYCOON': { file: 'spa.html', category: 'game' },
            'WIZARD RPG': { file: 'WizardRPG.html', category: 'game' },
            'VIKING RPG': { file: 'the-vikings', category: 'game' },
            'SPY RPG': { file: 'espionage.html', category: 'game' },
            'GLADIATOR RPG': { file: 'gladiatorrpg.html', category: 'game' },
            'EMPEROR RPG': { file: 'emperorRPG.html', category: 'game' },
            'NINJA RPG': { file: 'ninja.html', category: 'game' },
            'GLADIATOR DUELING': { file: 'gladiator2.html', category: 'game' },
            'ROMAN LEGIONNAIRE RPG': { file: 'roman-legionare.html', category: 'game' },
            'VIKING RPG 2': { file: 'VIKING-2.html', category: 'game' },
            'AI OVERLORD RPG': { file: 'AI-overlord-rpg.html', category: 'game' },
            'GREEK HERO RPG': { file: 'GREEK-HERO-RPG.html', category: 'game' },
            'CRAFTING RPG': { file: 'crafter.html', category: 'game' },
            'GREEK GOD RPG': { file: 'greek-gods.html', category: 'game' },
            'CELTIC DRUIDS': { file: 'celtiic-druids.html', category: 'game' },
            'EGYPTIAN HERO RPG': { file: 'EGYPT-HERO.html', category: 'game' },
            'CAMPUSLIFE COLLEGE': { file: 'CampusLifeCollege.html', category: 'game' },
            'MAYOR RPG': { file: 'mayor.rpg.html', category: 'game' },
            'CHEMICAL ADVENTURES': { file: 'Aichemical.html', category: 'game' },
            'INNKEEPER RPG': { file: 'innkeeper.html', category: 'game' },
            'SIEGE FORTRESS': { file: 'Siegefortress.html', category: 'game' },
            'SIEGE WARFARE': { file: 'siegewarfare.html', category: 'game' },
            'SIMPLESCRIPT EDITOR': { file: 'simplescript-editor.html', category: 'tool' },
            'STOCK MARKET': { file: 'stock.html', category: 'tool' },
            'TEXT EDITOR': { file: 'TextEditor.html', category: 'tool' },
            'TIC TAC TOE': { file: 'tictactoe.html', category: 'game' },
            'TODO LIST': { file: 'Todo.html', category: 'tool' },
            'TIMER': { file: 'ULTIMATE_TIMER.html', category: 'tool' },
            'UNIT CONVERTER': { file: 'unitconverter.html', category: 'tool' },
            'VIDEO PROCESSOR (OLD)': { file: 'video.html', category: 'tool' },
            'VIDEO PROCESSOR (NEW)': { file: 'video2.html', category: 'tool' },
            'STRATEGIC WAR GAME': { file: 'war-strategic.html', category: 'game' },
            'WEBCRAFT STUDIO': { file: 'webcraftstudio.html', category: 'tool' },
            'CRUISE SHIP TYCOON': { file: 'CruiseShipTycoon.html', category: 'game' }
        };

        const searchInput = document.getElementById('searchInput');
        const resultsList = document.getElementById('resultsList');
        const noResults = document.getElementById('noResults');
        let filteredFiles = Object.keys(htmlFiles);
        let selectedIndex = -1;

        function renderResults(files) {
            resultsList.innerHTML = '';
            
            if (files.length === 0) {
                noResults.classList.remove('hidden');
                return;
            }
            
            noResults.classList.add('hidden');
            
            files.forEach((displayName, index) => {
                const fileData = htmlFiles[displayName];
                const fileName = fileData.file;
                const category = fileData.category;
                
                // Color coding based on category
                const isSelected = index === selectedIndex;
                let itemClasses, hoverClasses, selectedClasses, iconColor, textColor;
                
                if (category === 'tool') {
                    itemClasses = 'border-green-400 bg-gray-900';
                    hoverClasses = 'hover:bg-green-900 hover:border-green-300';
                    selectedClasses = isSelected ? 'bg-green-800 border-green-300' : '';
                    iconColor = 'text-green-400';
                    textColor = 'text-green-400';
                } else {
                    itemClasses = 'border-red-400 bg-gray-900';
                    hoverClasses = 'hover:bg-red-900 hover:border-red-300';
                    selectedClasses = isSelected ? 'bg-red-800 border-red-300' : '';
                    iconColor = 'text-red-400';
                    textColor = 'text-red-400';
                }
                
                const item = document.createElement('div');
                item.className = `p-4 border cursor-pointer transition-all font-mono ${itemClasses} ${hoverClasses} ${selectedClasses}`;
                
                item.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <svg class="w-6 h-6 ${iconColor} mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                            <span class="text-lg font-medium ${textColor}">${displayName.toUpperCase()}</span>
                        </div>
                        <span class="text-sm text-green-300">${fileName}</span>
                    </div>
                `;
                
                item.addEventListener('click', () => navigateToFile(fileName));
                resultsList.appendChild(item);
            }); 
        }

        function navigateToFile(filename) {
            // Construct the CDN URL
            const cdnUrl = `https://cdn.jsdelivr.net/gh/3htmlers/mainframe@main/${filename}`;
            
            // Fetch the file content from CDN
            fetch(cdnUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.text();
                })
                .then(html => {
                    // Open a new tab with about:blank
                    const newWindow = window.open('about:blank', '_blank');
                    if (newWindow) {
                        // Write the fetched HTML content to the new window
                        newWindow.document.write(html);
                        newWindow.document.close();
                    }
                })
                .catch(error => {
                    console.error('Error fetching file:', error);
                    alert('Error loading file from CDN. Please try again.');
                });
        }

        function filterFiles(query) {
            if (!query.trim()) {
                filteredFiles = organizeFiles();
            } else {
                const allFiles = Object.keys(htmlFiles).filter(displayName => 
                    displayName.toLowerCase().includes(query.toLowerCase()) ||
                    htmlFiles[displayName].file.toLowerCase().includes(query.toLowerCase())
                );
                
                // Organize filtered results
                const tools = [];
                const games = [];
                
                allFiles.forEach(displayName => {
                    if (htmlFiles[displayName].category === 'tool') {
                        tools.push(displayName);
                    } else {
                        games.push(displayName);
                    }
                });
                
                tools.sort();
                games.sort();
                
                filteredFiles = [...tools, ...games];
            }
            selectedIndex = -1;
            renderResults(filteredFiles);
        }

        function updateSelection(direction) {
            if (filteredFiles.length === 0) return;
            
            if (direction === 'down') {
                selectedIndex = Math.min(selectedIndex + 1, filteredFiles.length - 1);
            } else if (direction === 'up') {
                selectedIndex = Math.max(selectedIndex - 1, -1);
            }
            
            renderResults(filteredFiles);
        }

        // Event listeners
        searchInput.addEventListener('input', (e) => {
            filterFiles(e.target.value);
        });

        searchInput.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowDown':
                    e.preventDefault();
                    updateSelection('down');
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    updateSelection('up');
                    break;
                case 'Enter':
                    e.preventDefault();
                    if (filteredFiles.length === 1) {
                        navigateToFile(htmlFiles[filteredFiles[0]].file);
                    } else if (selectedIndex >= 0 && selectedIndex < filteredFiles.length) {
                        navigateToFile(htmlFiles[filteredFiles[selectedIndex]].file);
                    }
                    break;
                case 'Escape':
                    searchInput.blur();
                    selectedIndex = -1;
                    renderResults(filteredFiles);
                    break;
            }
        });

        // Function to organize files by category and alphabetically
        function organizeFiles() {
            const tools = [];
            const games = [];
            
            Object.keys(htmlFiles).forEach(displayName => {
                if (htmlFiles[displayName].category === 'tool') {
                    tools.push(displayName);
                } else {
                    games.push(displayName);
                }
            });
            
            // Sort alphabetically
            tools.sort();
            games.sort();
            
            // Combine tools first, then games
            return [...tools, ...games];
        }

        // Initialize with organized files
        filteredFiles = organizeFiles();
        renderResults(filteredFiles);
        
        // Focus search input on page load
        searchInput.focus();
    </script>
