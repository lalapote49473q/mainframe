<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Whiteboard</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #f8f9fa;
        }
        
        .whiteboard-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        .toolbar {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 8px 15px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            border: 1px solid #e9ecef;
            max-width: 95vw;
            overflow-x: auto;
        }
        
        .tool-group {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 8px;
            border-right: 1px solid #e9ecef;
            flex-shrink: 0;
        }
        
        .tool-group:last-child {
            border-right: none;
        }
        
        .tool-btn {
            padding: 4px 8px;
            border: 1px solid #e9ecef;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
            color: #495057;
            white-space: nowrap;
        }
        
        .tool-btn:hover {
            border-color: #007bff;
            color: #007bff;
        }
        
        .tool-btn.active {
            background: #007bff;
            border-color: #007bff;
            color: white;
        }
        
        .color-picker {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .slider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .slider {
            width: 60px;
            height: 4px;
            border-radius: 2px;
            background: #e9ecef;
            outline: none;
            cursor: pointer;
        }
        
        .slider::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #007bff;
            cursor: pointer;
        }
        
        .slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #007bff;
            cursor: pointer;
            border: none;
        }
        
        .slider-label {
            font-size: 9px;
            color: #6c757d;
            font-weight: 500;
        }
        
        .canvas {
            background: white;
            cursor: crosshair;
            border: 1px solid #e9ecef;
        }
        
        .canvas.text-mode {
            cursor: text;
        }
        
        .text-input {
            position: absolute;
            border: 2px dashed #007bff;
            background: transparent;
            outline: none;
            resize: none;
            font-family: inherit;
            z-index: 100;
        }
        
        .clear-btn {
            padding: 4px 8px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        
        .clear-btn:hover {
            background: #c82333;
        }
        
        .page-indicator {
            font-size: 12px;
            font-weight: 600;
            color: #495057;
            padding: 0 6px;
            white-space: nowrap;
        }
        
        .canvas-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        
        .canvas {
            transform-origin: 0 0;
            transition: transform 0.2s ease;
        }
    </style>
</head>
<body>
    <div class="whiteboard-container">
        <div class="toolbar">
            <div class="tool-group">
                <button class="tool-btn active" id="drawBtn">✏️ Draw</button>
                <button class="tool-btn" id="textBtn">📝 Text</button>
                <button class="tool-btn" id="shapeBtn">🔷 Shapes</button>
            </div>
            
            <div class="tool-group" id="shapeTools" style="display: none;">
                <button class="tool-btn active" id="lineBtn">📏 Line</button>
                <button class="tool-btn" id="arrowBtn">➡️ Arrow</button>
                <button class="tool-btn" id="rectBtn">⬜ Rectangle</button>
                <button class="tool-btn" id="rectFilledBtn">⬛ Filled Rect</button>
                <button class="tool-btn" id="circleBtn">⭕ Circle</button>
                <button class="tool-btn" id="circleFilledBtn">⚫ Filled Circle</button>
            </div>
            
            <div class="tool-group">
                <input type="color" class="color-picker" id="colorPicker" value="#000000">
            </div>
            
            <div class="tool-group">
                <div class="slider-container">
                    <input type="range" class="slider" id="penThickness" min="1" max="20" value="3">
                    <span class="slider-label">Pen Size</span>
                </div>
            </div>
            
            <div class="tool-group">
                <div class="slider-container">
                    <input type="range" class="slider" id="fontSize" min="12" max="72" value="16">
                    <span class="slider-label">Font Size</span>
                </div>
            </div>
            
            <div class="tool-group">
                <button class="tool-btn" id="undoBtn">↶ Undo</button>
                <button class="tool-btn" id="redoBtn">↷ Redo</button>
            </div>
            
            <div class="tool-group">
                <button class="tool-btn" id="zoomOutBtn">🔍-</button>
                <button class="tool-btn" id="resetZoomBtn">100%</button>
                <button class="tool-btn" id="zoomInBtn">🔍+</button>
            </div>
            
            <div class="tool-group">
                <button class="tool-btn" id="prevPageBtn">◀</button>
                <span class="page-indicator" id="pageIndicator">Page 1</span>
                <button class="tool-btn" id="nextPageBtn">▶</button>
                <button class="tool-btn" id="addPageBtn">+ Page</button>
            </div>
            
            <div class="tool-group">
                <button class="clear-btn" id="clearBtn">🗑️ Clear</button>
            </div>
            
            <div class="tool-group">
                <button class="tool-btn" id="backBtn">🏠 Main</button>
            </div>
        </div>
        
        <div class="canvas-container">
            <canvas class="canvas" id="whiteboard"></canvas>
        </div>
    </div>

    <script>
        class Whiteboard {
            constructor() {
                this.canvas = document.getElementById('whiteboard');
                this.ctx = this.canvas.getContext('2d');
                this.isDrawing = false;
                this.currentTool = 'draw';
                this.currentShape = 'line';
                this.currentColor = '#000000';
                this.penThickness = 3;
                this.fontSize = 16;
                this.zoom = 1;
                
                // Shape drawing variables
                this.isDrawingShape = false;
                this.shapeStartX = 0;
                this.shapeStartY = 0;
                this.previewCanvas = null;
                this.previewCtx = null;
                
                // Multi-page support
                this.pages = [this.createBlankPage()];
                this.currentPageIndex = 0;
                
                // Undo/Redo support
                this.undoStack = [];
                this.redoStack = [];
                this.maxHistorySteps = 50;
                
                this.setupCanvas();
                this.setupPreviewCanvas();
                this.setupEventListeners();
                this.setupTools();
                this.saveState();
            }
            
            createBlankPage() {
                const canvas = document.createElement('canvas');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                return canvas;
            }
            
            setupCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                
                // Set canvas background to white
                this.ctx.fillStyle = 'white';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Set default drawing properties
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';
            }
            
            setupPreviewCanvas() {
                this.previewCanvas = document.createElement('canvas');
                this.previewCanvas.width = window.innerWidth;
                this.previewCanvas.height = window.innerHeight;
                this.previewCanvas.style.position = 'absolute';
                this.previewCanvas.style.top = '0';
                this.previewCanvas.style.left = '0';
                this.previewCanvas.style.pointerEvents = 'none';
                this.previewCanvas.style.zIndex = '10';
                this.previewCtx = this.previewCanvas.getContext('2d');
                this.previewCtx.lineCap = 'round';
                this.previewCtx.lineJoin = 'round';
                document.querySelector('.canvas-container').appendChild(this.previewCanvas);
            }
            
            setupEventListeners() {
                // Drawing events
                this.canvas.addEventListener('mousedown', (e) => this.startDrawing(e));
                this.canvas.addEventListener('mousemove', (e) => this.draw(e));
                this.canvas.addEventListener('mouseup', (e) => this.finishDrawing(e));
                this.canvas.addEventListener('mouseout', () => this.stopDrawing());
                
                // Text events
                this.canvas.addEventListener('click', (e) => this.handleTextClick(e));
                
                // Resize event
                window.addEventListener('resize', () => this.resizeCanvas());
            }
            
            setupTools() {
                // Tool buttons
                document.getElementById('drawBtn').addEventListener('click', () => this.setTool('draw'));
                document.getElementById('textBtn').addEventListener('click', () => this.setTool('text'));
                document.getElementById('shapeBtn').addEventListener('click', () => this.setTool('shape'));
                
                // Shape buttons
                document.getElementById('lineBtn').addEventListener('click', () => this.setShape('line'));
                document.getElementById('arrowBtn').addEventListener('click', () => this.setShape('arrow'));
                document.getElementById('rectBtn').addEventListener('click', () => this.setShape('rectangle'));
                document.getElementById('rectFilledBtn').addEventListener('click', () => this.setShape('rectangleFilled'));
                document.getElementById('circleBtn').addEventListener('click', () => this.setShape('circle'));
                document.getElementById('circleFilledBtn').addEventListener('click', () => this.setShape('circleFilled'));
                
                // Color picker
                document.getElementById('colorPicker').addEventListener('change', (e) => {
                    this.currentColor = e.target.value;
                });
                
                // Pen thickness
                document.getElementById('penThickness').addEventListener('input', (e) => {
                    this.penThickness = e.target.value;
                });
                
                // Font size
                document.getElementById('fontSize').addEventListener('input', (e) => {
                    this.fontSize = e.target.value;
                });
                
                // Undo/Redo buttons
                document.getElementById('undoBtn').addEventListener('click', () => this.undo());
                document.getElementById('redoBtn').addEventListener('click', () => this.redo());
                
                // Zoom buttons
                document.getElementById('zoomInBtn').addEventListener('click', () => this.zoomIn());
                document.getElementById('zoomOutBtn').addEventListener('click', () => this.zoomOut());
                document.getElementById('resetZoomBtn').addEventListener('click', () => this.resetZoom());
                
                // Page navigation
                document.getElementById('prevPageBtn').addEventListener('click', () => this.previousPage());
                document.getElementById('nextPageBtn').addEventListener('click', () => this.nextPage());
                document.getElementById('addPageBtn').addEventListener('click', () => this.addPage());
                
                // Clear button
                document.getElementById('clearBtn').addEventListener('click', () => this.clearCanvas());
                
                // Back to main button
                document.getElementById('backBtn').addEventListener('click', () => {
                    window.location.href = 'main.html';
                });
            }
            
            setTool(tool) {
                this.currentTool = tool;
                
                // Update button states
                document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
                document.getElementById(tool + 'Btn').classList.add('active');
                
                // Show/hide shape tools
                const shapeTools = document.getElementById('shapeTools');
                if (tool === 'shape') {
                    shapeTools.style.display = 'flex';
                } else {
                    shapeTools.style.display = 'none';
                }
                
                // Update cursor
                if (tool === 'text') {
                    this.canvas.classList.add('text-mode');
                } else {
                    this.canvas.classList.remove('text-mode');
                }
            }
            
            setShape(shape) {
                this.currentShape = shape;
                
                // Update shape button states
                document.querySelectorAll('#shapeTools .tool-btn').forEach(btn => btn.classList.remove('active'));
                if (shape === 'rectangleFilled') {
                    document.getElementById('rectFilledBtn').classList.add('active');
                } else if (shape === 'circleFilled') {
                    document.getElementById('circleFilledBtn').classList.add('active');
                } else {
                    document.getElementById(shape + 'Btn').classList.add('active');
                }
            }
            
            saveState() {
                const imageData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
                this.undoStack.push(imageData);
                if (this.undoStack.length > this.maxHistorySteps) {
                    this.undoStack.shift();
                }
                this.redoStack = [];
                this.updateUndoRedoButtons();
            }
            
            undo() {
                if (this.undoStack.length > 1) {
                    this.redoStack.push(this.undoStack.pop());
                    const imageData = this.undoStack[this.undoStack.length - 1];
                    this.ctx.putImageData(imageData, 0, 0);
                    this.updateCurrentPage();
                    this.updateUndoRedoButtons();
                }
            }
            
            redo() {
                if (this.redoStack.length > 0) {
                    const imageData = this.redoStack.pop();
                    this.undoStack.push(imageData);
                    this.ctx.putImageData(imageData, 0, 0);
                    this.updateCurrentPage();
                    this.updateUndoRedoButtons();
                }
            }
            
            updateUndoRedoButtons() {
                document.getElementById('undoBtn').style.opacity = this.undoStack.length > 1 ? '1' : '0.5';
                document.getElementById('redoBtn').style.opacity = this.redoStack.length > 0 ? '1' : '0.5';
            }
            
            startDrawing(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) / this.zoom;
                const y = (e.clientY - rect.top) / this.zoom;
                
                if (this.currentTool === 'draw') {
                    this.isDrawing = true;
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, y);
                    this.ctx.strokeStyle = this.currentColor;
                    this.ctx.lineWidth = this.penThickness;
                } else if (this.currentTool === 'shape') {
                    this.isDrawingShape = true;
                    this.shapeStartX = x;
                    this.shapeStartY = y;
                }
            }
            
            draw(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) / this.zoom;
                const y = (e.clientY - rect.top) / this.zoom;
                
                if (this.isDrawing && this.currentTool === 'draw') {
                    this.ctx.lineTo(x, y);
                    this.ctx.stroke();
                } else if (this.isDrawingShape && this.currentTool === 'shape') {
                    this.drawShapePreview(this.shapeStartX, this.shapeStartY, x, y);
                }
            }
            
            finishDrawing(e) {
                if (this.isDrawing) {
                    this.isDrawing = false;
                    this.ctx.beginPath();
                    this.saveState();
                } else if (this.isDrawingShape) {
                    const rect = this.canvas.getBoundingClientRect();
                    const endX = (e.clientX - rect.left) / this.zoom;
                    const endY = (e.clientY - rect.top) / this.zoom;
                    
                    this.ctx.strokeStyle = this.currentColor;
                    this.ctx.fillStyle = this.currentColor;
                    this.ctx.lineWidth = this.penThickness;
                    this.drawShape(this.ctx, this.shapeStartX, this.shapeStartY, endX, endY, this.currentShape);
                    
                    this.isDrawingShape = false;
                    this.clearPreview();
                    this.saveState();
                }
            }
            
            stopDrawing() {
                if (this.isDrawing) {
                    this.isDrawing = false;
                    this.ctx.beginPath();
                    this.saveState();
                } else if (this.isDrawingShape) {
                    this.isDrawingShape = false;
                    this.clearPreview();
                }
            }
            
            handleTextClick(e) {
                if (this.currentTool !== 'text') return;
                
                const rect = this.canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) / this.zoom;
                const y = (e.clientY - rect.top) / this.zoom;
                
                this.createTextInput(x, y);
            }
            
            drawShapePreview(startX, startY, endX, endY) {
                this.clearPreview();
                this.previewCtx.strokeStyle = this.currentColor;
                this.previewCtx.fillStyle = this.currentColor;
                this.previewCtx.lineWidth = this.penThickness;
                this.previewCtx.transform(this.zoom, 0, 0, this.zoom, 0, 0);
                
                this.drawShape(this.previewCtx, startX, startY, endX, endY, this.currentShape);
                this.previewCtx.setTransform(1, 0, 0, 1, 0, 0);
            }
            
            drawShape(ctx, startX, startY, endX, endY, shape) {
                ctx.beginPath();
                
                switch (shape) {
                    case 'line':
                        ctx.moveTo(startX, startY);
                        ctx.lineTo(endX, endY);
                        ctx.stroke();
                        break;
                        
                    case 'arrow':
                        this.drawArrow(ctx, startX, startY, endX, endY);
                        break;
                        
                    case 'rectangle':
                        const width = endX - startX;
                        const height = endY - startY;
                        ctx.rect(startX, startY, width, height);
                        ctx.stroke();
                        break;
                        
                    case 'rectangleFilled':
                        const widthFilled = endX - startX;
                        const heightFilled = endY - startY;
                        ctx.fillRect(startX, startY, widthFilled, heightFilled);
                        break;
                        
                    case 'circle':
                        const centerX = (startX + endX) / 2;
                        const centerY = (startY + endY) / 2;
                        const radius = Math.sqrt(Math.pow(endX - startX, 2) + Math.pow(endY - startY, 2)) / 2;
                        ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                        ctx.stroke();
                        break;
                        
                    case 'circleFilled':
                        const centerXFilled = (startX + endX) / 2;
                        const centerYFilled = (startY + endY) / 2;
                        const radiusFilled = Math.sqrt(Math.pow(endX - startX, 2) + Math.pow(endY - startY, 2)) / 2;
                        ctx.arc(centerXFilled, centerYFilled, radiusFilled, 0, 2 * Math.PI);
                        ctx.fill();
                        break;
                }
            }
            
            drawArrow(ctx, startX, startY, endX, endY) {
                const headLength = 15;
                const angle = Math.atan2(endY - startY, endX - startX);
                
                // Draw line
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.stroke();
                
                // Draw arrowhead
                ctx.beginPath();
                ctx.moveTo(endX, endY);
                ctx.lineTo(endX - headLength * Math.cos(angle - Math.PI / 6), endY - headLength * Math.sin(angle - Math.PI / 6));
                ctx.moveTo(endX, endY);
                ctx.lineTo(endX - headLength * Math.cos(angle + Math.PI / 6), endY - headLength * Math.sin(angle + Math.PI / 6));
                ctx.stroke();
            }
            
            clearPreview() {
                this.previewCtx.clearRect(0, 0, this.previewCanvas.width, this.previewCanvas.height);
            }
            
            zoomIn() {
                this.zoom = Math.min(this.zoom * 1.2, 5);
                this.updateZoom();
            }
            
            zoomOut() {
                this.zoom = Math.max(this.zoom / 1.2, 0.1);
                this.updateZoom();
            }
            
            resetZoom() {
                this.zoom = 1;
                this.updateZoom();
            }
            
            updateZoom() {
                this.canvas.style.transform = `scale(${this.zoom})`;
                document.getElementById('resetZoomBtn').textContent = Math.round(this.zoom * 100) + '%';
            }
            
            addPage() {
                this.updateCurrentPage();
                this.pages.push(this.createBlankPage());
                this.currentPageIndex = this.pages.length - 1;
                this.loadCurrentPage();
                this.updatePageIndicator();
            }
            
            previousPage() {
                if (this.currentPageIndex > 0) {
                    this.updateCurrentPage();
                    this.currentPageIndex--;
                    this.loadCurrentPage();
                    this.updatePageIndicator();
                }
            }
            
            nextPage() {
                if (this.currentPageIndex < this.pages.length - 1) {
                    this.updateCurrentPage();
                    this.currentPageIndex++;
                    this.loadCurrentPage();
                    this.updatePageIndicator();
                }
            }
            
            updateCurrentPage() {
                const imageData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
                this.pages[this.currentPageIndex].getContext('2d').putImageData(imageData, 0, 0);
            }
            
            loadCurrentPage() {
                const pageCanvas = this.pages[this.currentPageIndex];
                this.ctx.drawImage(pageCanvas, 0, 0);
                this.undoStack = [];
                this.redoStack = [];
                this.saveState();
            }
            
            updatePageIndicator() {
                document.getElementById('pageIndicator').textContent = `Page ${this.currentPageIndex + 1}`;
                document.getElementById('prevPageBtn').style.opacity = this.currentPageIndex > 0 ? '1' : '0.5';
                document.getElementById('nextPageBtn').style.opacity = this.currentPageIndex < this.pages.length - 1 ? '1' : '0.5';
            }
            
            createTextInput(x, y) {
                // Remove any existing text inputs
                const existingInputs = document.querySelectorAll('.text-input');
                existingInputs.forEach(input => input.remove());
                
                const textInput = document.createElement('textarea');
                textInput.className = 'text-input';
                textInput.style.left = (x * this.zoom) + 'px';
                textInput.style.top = (y * this.zoom) + 'px';
                textInput.style.fontSize = this.fontSize + 'px';
                textInput.style.color = this.currentColor;
                textInput.style.width = '200px';
                textInput.style.height = '100px';
                textInput.placeholder = 'Type your text here...';
                
                document.body.appendChild(textInput);
                textInput.focus();
                
                // Handle text input completion
                const finishText = () => {
                    const text = textInput.value.trim();
                    if (text) {
                        this.drawText(text, x, y);
                        this.saveState();
                    }
                    textInput.remove();
                };
                
                textInput.addEventListener('blur', finishText);
                textInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        textInput.remove();
                    }
                });
            }
            
            drawText(text, x, y) {
                this.ctx.font = `${this.fontSize}px Arial, sans-serif`;
                this.ctx.fillStyle = this.currentColor;
                this.ctx.textBaseline = 'top';
                
                const lines = text.split('\n');
                const lineHeight = this.fontSize * 1.2;
                
                lines.forEach((line, index) => {
                    this.ctx.fillText(line, x, y + (index * lineHeight));
                });
            }
            
            clearCanvas() {
                this.ctx.fillStyle = 'white';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Remove any text inputs
                const existingInputs = document.querySelectorAll('.text-input');
                existingInputs.forEach(input => input.remove());
            }
            
            resizeCanvas() {
                // Update current page before resizing
                this.updateCurrentPage();
                
                // Resize canvas
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                
                // Resize preview canvas
                this.previewCanvas.width = window.innerWidth;
                this.previewCanvas.height = window.innerHeight;
                
                // Resize all pages
                this.pages.forEach(page => {
                    const oldImageData = page.getContext('2d').getImageData(0, 0, page.width, page.height);
                    page.width = window.innerWidth;
                    page.height = window.innerHeight;
                    const ctx = page.getContext('2d');
                    ctx.fillStyle = 'white';
                    ctx.fillRect(0, 0, page.width, page.height);
                    ctx.putImageData(oldImageData, 0, 0);
                });
                
                // Reload current page
                this.loadCurrentPage();
                
                // Restore canvas properties
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';
                this.previewCtx.lineCap = 'round';
                this.previewCtx.lineJoin = 'round';
            }
        }
        
        // Initialize the whiteboard when the page loads
        window.addEventListener('load', () => {
            const whiteboard = new Whiteboard();
            whiteboard.updatePageIndicator();
            whiteboard.updateUndoRedoButtons();
        });
